; Preset di export.
;
; include_filter="*.json" è NECESSARIO: i dati di gioco non sono risorse Godot
; e senza questo filtro non finirebbero nella build.
;
; exclude_filter toglie ciò che può: gli script di test con `class_name`
; (TestCase e chi lo estende) restano comunque nel pacchetto, perché la cache
; delle classi globali li referenzia. Sono pochi KB, non vale la pena forzare.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,core/tests/*,core/tools/*,tools/*,docs/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
